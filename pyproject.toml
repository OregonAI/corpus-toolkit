[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-toolkit"
version = "1.32.0"
description = "Shared validation, provenance, and MCP framework for the civic corpus platform"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "jsonschema",
    # HTTP/2, and it is a CORRECTNESS dependency rather than a performance one
    # (corpus-toolkit#162). A growing number of government hosts refuse HTTP/1.1 outright
    # -- 403 on HTTP/1.1, 200 on HTTP/2, same User-Agent -- and `urllib` speaks only
    # HTTP/1.1, so 54 oregon-counties sources could never be seeded while that repo's own
    # ingest reached the same hosts fine. The `[http2]` extra is what pulls in `h2`;
    # without it httpx accepts `http2=True` and silently speaks HTTP/1.1 anyway.
    #
    # BOUNDED ON BOTH SIDES, for the reason the extras below already record: an unbounded
    # dependency floats onto the next major the day it ships.
    "httpx[http2]>=0.27,<1.0",
]

[project.optional-dependencies]
# BOUNDED ON BOTH SIDES, and the bound is exactly what has been TESTED.
#
# This was an unbounded `mcp[cli]`, so it floated onto mcp 2.0.0 the day that shipped and
# took `mcp.server.fastmcp` with it. server.py imported FastMCP at module scope, so CI on
# main went red on a docs-only commit -- and worse, a corpus image built green and could
# not start, because the Dockerfile's own smoke step imports `framework` (stdlib-only,
# fine on both majors) while the container runs `server`.
#
# The toolkit now spans both majors via corpus_toolkit/mcp/_sdk.py, and the CI matrix in
# .github/workflows/tests.yml runs the whole suite under each. Verified against
# **1.28.1 and 2.0.0** -- those two exactly, by running the suite, not by reading a
# changelog. The floor is the oldest release verified; the ceiling excludes a major
# nobody has seen. Raise either end only after the matrix has run against the version
# being admitted; a bound that claims more than has been tested is worse than no bound,
# because it reads as a guarantee.
mcp = ["mcp[cli]>=1.28,<3"]
# numpy is here so the semantic arm is actually TESTED, not skipped.
#
# `corpus_toolkit.semantic.search.selftest()` was written to run without the embeddings
# artifact -- which is gitignored and absent from CI -- precisely so CI could run it. CI
# then never called it, and it would have skipped on ImportError if it had: the tests job
# installs `.[mcp,test]`, which does not bring numpy. So ~280 lines of the semantic arm,
# including the convert-once optimisation whose whole selftest exists to prove it is
# behaviour-preserving, had no automated check at all.
test = ["pytest", "numpy",
        # 3.10 ONLY. `tomllib` is 3.11+, and the release gate reads pyproject.toml to
        # check that every extra the template depends on is declared
        # (corpus-toolkit#116). Same parser, pre-stdlib name.
        "tomli; python_version < '3.11'"]
# THE SEMANTIC ARM'S ONLY RUNTIME DEPENDENCY, and it is deliberately just numpy.
#
# corpus_toolkit/semantic/ imports numpy lazily, inside functions, so a corpus that never
# enables semantic search pays nothing -- which is why this is an extra rather than a base
# dependency. But a corpus that DOES enable it needs numpy present, and discovering that at
# runtime is the worst way: the loader swallows every exception and reports
# `available() -> False`, so a missing numpy looks exactly like a missing mount, and the
# corpus serves keyword-only while reporting healthy. That is precisely what happened
# deploying federal-reference.
#
# NOT torch, NOT sentence-transformers. Those live in the shared encoder service; a corpus
# holds vectors and does one matmul against them. Keeping this extra to numpy is what makes
# a corpus image ~50 MiB of dependency instead of ~2.5 GiB of CUDA wheel.
semantic = ["numpy"]


[project.scripts]
corpus-verify-extraction = "corpus_toolkit.validate.extraction:main"
corpus-verify = "corpus_toolkit.verify:main"
corpus-validate-frontmatter = "corpus_toolkit.validate.frontmatter:main"
corpus-verify-provenance = "corpus_toolkit.validate.provenance:main"
corpus-detect-changes = "corpus_toolkit.sources.changes:main"
corpus-generate-status = "corpus_toolkit.status:main"
corpus-generate-index = "corpus_toolkit.index:main"
corpus-detect-unsourced = "corpus_toolkit.grounding:main"
corpus-mcp-serve = "corpus_toolkit.mcp.server:main"
# The semantic arm was the only CLI without an entry point — invoked as
# `python3 -m corpus_toolkit.semantic.build` while all its peers got a `corpus-*`
# command. That also kept it outside the `entrypoints` CI job, which verifies every
# console script resolves, so ~730 LOC across two releases had no import check at all
# (corpus-toolkit#41).
corpus-build-semantic-index = "corpus_toolkit.semantic.build:main"

[tool.setuptools.packages.find]
include = ["corpus_toolkit*"]

# The frontmatter schema ships INSIDE the package so `pip install corpus-toolkit` is
# sufficient to validate a corpus. It used to live at the repo root, reachable only by
# checking the toolkit out into .toolkit/ — which the reusable workflows do, but no
# contributor does, so every documented local validation command was unrunnable.
[tool.setuptools.package-data]
corpus_toolkit = ["schemas/*.json"]
