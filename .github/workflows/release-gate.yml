name: release-gate

# A toolkit tag must mean something, because every corpus pins one.
#
# Measured across the org on 2026-07-28, corpus-toolkit had the WORST CI pass rate of the
# six repos (36.8% over 19 runs, against 98.0% for executive-regulatory-frameworks) while
# being the only repo all the others depend on. A defect here is not one bug: it is one
# bug per corpus, found N times and fixed N times. corpus-toolkit#1 is titled "CI has
# been red since v1.5.0" — a tag was cut while CI was failing and downstream found out.
#
# `tests` covers the toolkit in isolation and passes. Nothing checked that a tag drives a
# REAL corpus, and that gap has a measured cost: both graph defects filed on 2026-07-28
# (#4 external edge targets raising KeyError on every document of a cross-corpus corpus,
# #5 the false "no document with id X") were live on four servers with 73 unit tests
# green, because no test ever built a corpus and called a tool. contract_smoke.py does.
#
# WHY IT ALSO RUNS ON PR AND MAIN, not only on tags. GitHub has no pre-tag hook: by the
# time a workflow can run, the ref already exists and a downstream `uses: ...@vX.Y.Z` can
# already resolve it. The only way to make a tag trustworthy is to keep main
# continuously verified so that tagging a green main is safe. The tag job below is the
# backstop for the case where that is not true, and it DELETES the offending tag rather
# than leaving a red one for four corpora to pin.
#
# TWO TRACKS (ADR-0014). Since v1.33.0 the corpora's CI calls the reusable workflows at
# the FLOATING major tag `v1`, and only their serving images pin an exact tag (in
# requirements.txt). This workflow is what makes floating safe: `v1` moves ONLY when the
# `canary` job below has cloned every live public corpus and run the CI-track CLIs on the
# candidate, green. A release that would break a corpus therefore stalls here, with the
# corpus named — the fix lands in that corpus first, then the tag moves. Before this, the
# same release opened thirteen pin-bump PRs and found out one at a time; measured 2026-09-02,
# 154 of the 616 PRs merged across the org in seven weeks were those bumps.
on:
  pull_request:
  push:
    branches: [main]
    # EXACT release tags only. `v1` is moved by the advance job below and must not
    # re-trigger this workflow: version-matches-tag would read `1` against pyproject and
    # the unpublish job would delete the very tag it had just advanced. (A push made with
    # GITHUB_TOKEN does not trigger workflows anyway; this is the belt to that brace.)
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both SDK majors. A tag is consumed by corpus images that resolve the SDK fresh
        # at build time, so "this tag serves the contract" is only true if it is true on
        # whichever SDK pip happens to hand them. mcp 2.0.0 made that concrete: same
        # toolkit tag, image builds green, container will not start.
        mcp-spec: ["mcp[cli]>=1.28,<2", "mcp[cli]>=2,<3"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: toolkit
      # The template is the corpus every new corpus starts as, so verifying against it
      # verifies the shape all of them share. Its own default branch, deliberately: a
      # toolkit release must work against the template as it stands today, not against
      # some pinned historical copy that would let the two drift apart unnoticed.
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-template
          path: template
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The mcp extra is not optional here: contract_smoke.py builds the real FastMCP
      # server and calls tools through the SDK's tool manager. Installing without it
      # would skip step 5 entirely — which is the only step that would have caught the
      # two graph bugs.
      - name: Install the candidate ref
        run: pip install -e "./toolkit[mcp,test]" "${{ matrix.mcp-spec }}"
      - name: A real corpus must validate and serve every mandatory contract tool
        run: |
          python3 -c "from corpus_toolkit.mcp import sdk; print('mcp', sdk.sdk_version(), 'major', sdk.SDK_MAJOR)"
          python3 toolkit/.github/scripts/contract_smoke.py --template "$PWD/template"

  # A TAG MUST AGREE WITH THE VERSION IT SHIPS. pyproject sat at 1.18.0 while the newest
  # tag was v1.23.0 — five releases during which anyone installing the toolkit got a
  # package reporting a version it was not, and `importlib.metadata.version` (which
  # `sdk.sdk_version`-style diagnostics and any downstream compatibility check would
  # read) answered 1.18.0. Nothing noticed, because nothing compared the two
  # (corpus-toolkit#41).
  #
  # Runs on PRs too, not only on tags, so the bump lands in the PR that earns it rather
  # than being remembered at tag time — the same reasoning as the end-to-end gate above.
  # On a PR it only warns, because most PRs legitimately do not bump; on a tag it fails,
  # and the unpublish job below removes the tag.
  version-matches-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: pyproject version must match the tag
        run: |
          set -euo pipefail
          V=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version: $V"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            T="${GITHUB_REF_NAME#v}"
            if [ "$V" != "$T" ]; then
              echo "::error::tag $GITHUB_REF_NAME ships pyproject version $V. A corpus that"
              echo "::error::pins this tag would install a package claiming to be $V."
              exit 1
            fi
            echo "tag $GITHUB_REF_NAME agrees with pyproject $V"
          else
            # `|| true`: under pipefail a grep with no match (a shallow checkout has no tags)
            # would fail the pipeline, and this branch is the warn-only PR path.
            LATEST=$(git tag --sort=-v:refname | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -1 | sed 's/^v//')
            echo "latest tag: ${LATEST:-none}"
            if [ -n "$LATEST" ] && [ "$V" = "$LATEST" ]; then
              echo "::notice::version is unchanged from the latest tag — fine for a PR that"
              echo "::notice::is not a release, but the release PR must bump it."
            fi
          fi

  # THE CANARY MATRIX COMES FROM THE MANIFEST (ADR-0008), not from a list typed here.
  # propagate-pin.yml reads the same file for its own matrix and checks it against the
  # org on every run, so a corpus that joins the platform joins both jobs by one edit.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      canary: ${{ steps.matrix.outputs.canary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Read the canary matrix from corpora.yml
        id: matrix
        run: |
          set -euo pipefail
          m=$(corpus-manifest --canary-matrix)
          echo "canary targets: $m"
          echo "canary=$m" >> "$GITHUB_OUTPUT"

  # THE CANARY (ADR-0014). Every live public corpus, cloned at its default branch, run
  # through the CI-track CLIs — the same three the reusable workflows call — on the
  # CANDIDATE toolkit. This is the check that used to happen thirteen times, one pin-bump
  # PR per corpus, after the tag already existed; it now happens once, before `v1` moves.
  #
  # Only the CI track is exercised here. A corpus's own `--check` gates run against the
  # exact tag its requirements.txt pins (the serving track), and are proven on the
  # requirements bump PR propagate-pin opens after this gate — that is the right place,
  # because that PR is where the corpus's served code actually changes.
  #
  # HELD IS REPORTED, NOT BLOCKING. A corpus that pins the reusable workflows at an exact
  # tag instead of `@v1` has opted out of this release; its leg still runs (so the gap is
  # visible in the log) but `continue-on-error` keeps it from stalling everyone else. The
  # state is read from the corpus's own workflow files by `corpus-manifest
  # --ci-track-state`, so there is no second list to maintain. Before the sweep that put
  # the corpora on `@v1` every corpus read as held, which made the first release under this
  # gate trivially green — that is the intended opt-in shape, not a gap.
  #
  # Not on pull requests: executive-regulatory-frameworks alone is 75k documents and ~8
  # minutes of full validation, and a PR to this repo is proven by the template leg above.
  # Main pushes, tags and dispatches run it, so a tag is cut from a main the canary has
  # already seen.
  canary:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # MEASURED, first tag under this gate (v1.33.0, 2026-09-03): executive-regulatory-
    # frameworks needs ~1 min to clone, 8 min for full frontmatter and 27-29 min for full
    # provenance (its own nightly `verify / verify` job takes 27m, 27m, 29m on three
    # consecutive days). A 30-minute cap cancelled that leg at the provenance step, and a
    # CANCELLED leg is not a FAILED one: the unpublish job below did not fire, `v1` did not
    # move, and the tag sat there looking released. Sixty minutes is the measured cost plus
    # headroom, not a guess; the other seven legs finish in 1-5 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.canary) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: toolkit
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/${{ matrix.repo }}
          path: corpus
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the candidate
        run: pip install ./toolkit
      - name: Is this corpus on the CI track, or held?
        id: track
        working-directory: corpus
        run: |
          set -euo pipefail
          state_json=$(corpus-manifest --ci-track-state .)
          echo "$state_json"
          state=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["state"])' "$state_json")
          echo "state=$state" >> "$GITHUB_OUTPUT"
          case "$state" in
            floating) echo "${{ matrix.repo }} is on the CI track: a failure below blocks this release" ;;
            held)     echo "::notice::${{ matrix.repo }} is HELD at an exact tag — reported below, not blocking" ;;
            mixed)    echo "::warning::${{ matrix.repo }} mixes @v1 with exact tags (a partial bump) — treated as held" ;;
            *)        echo "::warning::${{ matrix.repo }} calls no reusable workflow at all — treated as held" ;;
          esac
      - name: Full frontmatter validation on the candidate
        working-directory: corpus
        continue-on-error: ${{ steps.track.outputs.state != 'floating' }}
        run: corpus-validate-frontmatter --config _meta/corpus.yml
      - name: Full provenance verification on the candidate
        working-directory: corpus
        continue-on-error: ${{ steps.track.outputs.state != 'floating' }}
        run: corpus-verify-provenance --config _meta/corpus.yml
      - name: Relationship graph and corpus configuration on the candidate
        working-directory: corpus
        continue-on-error: ${{ steps.track.outputs.state != 'floating' }}
        run: corpus-validate-frontmatter --config _meta/corpus.yml --check-relationships

  # MOVE `v1` TO THIS RELEASE, and only now. Every gate above is green on a tag, so the
  # floating tag every corpus's CI resolves may advance. The tag is the release's OUTPUT,
  # never something a human moves: a hand-moved `v1` is a release nothing proved.
  #
  # ROLLBACK is one line, from any checkout with push rights:
  #     git push --force origin <previous-release-sha>:refs/tags/v1
  # and every corpus's next CI run is back on the previous release with no PR anywhere.
  advance-major-tag:
    needs: [corpus-end-to-end, version-matches-tag, canary]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && needs.corpus-end-to-end.result == 'success'
      && needs.version-matches-tag.result == 'success'
      && needs.canary.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # THE PAT, NOT THE BUILT-IN TOKEN. Moving `v1` onto a commit that changed a file under
      # .github/workflows/ is refused for GITHUB_TOKEN -- "refusing to allow a GitHub App to
      # create or update workflow ... without `workflows` permission" -- and `workflows` is
      # not a permission a job can grant itself. Measured on v1.34.1 (2026-09-03): every
      # canary leg green, the tag proven, and `v1` did not move. The reusable workflows ARE
      # the CI track, so a release that touches them is exactly the kind that must advance.
      # WHICH TOKEN. Measured on v1.34.2 (2026-09-03): CORPUS_PIN_TOKEN is scoped to the
      # twelve repos propagate-pin writes to and NOT to this one -- "Permission to
      # OregonAI/corpus-toolkit.git denied" -- so it cannot move a tag here either. The org
      # secret DRIFT_BOT_TOKEN (contents + pull-requests + workflows write on every OregonAI
      # repo, this one included) is the one token meant to do both jobs; it is preferred,
      # then the PAT, then the built-in token, which works only for a release that touched
      # no workflow file. Until DRIFT_BOT_TOKEN exists, a release touching a reusable
      # workflow is proven by this gate and its `v1` is moved by hand:
      #     git push --force origin <release-sha>:refs/tags/v1
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DRIFT_BOT_TOKEN || secrets.CORPUS_PIN_TOKEN || github.token }}
      - name: Point the floating major tag at this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::not a release tag: $TAG"; exit 1;; esac
          MAJOR="${TAG%%.*}"
          git config user.name "corpus-bot"
          git config user.email "actions@github.com"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push --force origin "refs/tags/$MAJOR"
          echo "::notice::$MAJOR now points at $TAG ($GITHUB_SHA). Every corpus on the CI track runs it from its next job."

  # Only on a tag, and only if a gate above failed. GitHub cannot refuse a tag; it can
  # unpublish one. A red tag left in place is worse than no tag at all — `uses:
  # OregonAI/corpus-toolkit/...@v1.7.0` resolves it silently and four corpora inherit the
  # defect, which is exactly the history this file is trying to end. A red CANARY counts:
  # a release that breaks a live corpus is not a release, and `v1` has not moved.
  #
  # CANCELLED COUNTS AS FAILED HERE. `failure()` alone is false when a needed job was
  # cancelled — by its own timeout, say — and that is precisely the outcome that reads as
  # somebody's decision and gets no investigation (the same trap ERF's generated-views
  # fan-in documents). A tag whose canary did not finish is a tag nothing proved.
  unpublish-a-failed-tag:
    needs: [corpus-end-to-end, version-matches-tag, canary]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete the tag the gate rejected
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "::error::release gate FAILED for $TAG — deleting the tag so no corpus can"
          echo "::error::pin a ref that does not serve the contract. Fix main, re-tag."
          echo "::error::The floating major tag has NOT moved; corpora on the CI track are unaffected."
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
          echo "deleted tag $TAG"
          exit 1
