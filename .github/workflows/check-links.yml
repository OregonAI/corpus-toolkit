# Reusable workflow: markdown link + reference integrity.
# Also checks that every `relationships` target resolves (local or corpus:id).
name: check-links
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: >-
          corpus-toolkit tag to install. Set this explicitly to the same tag you pin in
          `uses:` — they are separate knobs and drift silently otherwise, because `uses:`
          selects the WORKFLOW FILE while this selects the CODE it runs.
        type: string
        required: true
      exclude-paths:
        description: newline-separated paths to exclude from the lychee link scan (e.g. large snapshot/template dirs)
        type: string
        default: ""
      exclude-urls:
        description: >-
          newline-separated URL regexes lychee should skip. For hosts quoted INSIDE
          mirrored third-party text, where the link is part of the source document and
          cannot be corrected without altering it — a dead URL inside a ratified contract
          is a fact about that contract. Excluding by path was the only lever before this
          (corpus-toolkit#51) and it drops the corpus's own curator prose along with the
          mirrored text.
        type: string
        default: ""
      accept-codes:
        description: HTTP status codes/ranges lychee treats as OK (comma-separated, lychee's own syntax e.g. "200..=299,403,429")
        type: string
        default: "200,203,206,429"
      max-retries:
        description: >-
          How many times lychee retries a link before calling it broken. A weekly check
          over tens of thousands of links will meet a reset connection eventually, and one
          of them used to turn the whole run red — `http://www.osbar.org/ | Network error:
          Connection reset by peer`, on a host that answers 200 when asked again. A
          transient network fault is not a finding, and a check that reports it as one is a
          check people stop reading.
        type: number
        default: 3
      retry-wait-time:
        description: seconds lychee waits between retries
        type: number
        default: 2
      chain-supplements:
        description: >-
          Set true when the corpus carries `_meta/tls-chain/*.pem` (ADR 0012) and its link
          check should use them. The PEMs are appended to the runner's CA bundle and lychee
          is pointed at it with SSL_CERT_FILE.

          WHETHER LYCHEE HONOURS IT IS NOT ASSUMED. lychee is Rust, and the answer depends on
          whether its TLS backend reads the environment (native-tls/OpenSSL does; rustls with
          a baked-in root store does not). A corpus turning this on should REMOVE its
          `exclude-urls` entry for the host in the same PR and let the run answer the
          question — and if the run is red, put the entry back with lychee's backend named as
          the cause, so the mute stops being attributed to the upstream server.

          Note this only completes a chain; it is not a bypass, for the same measured reason
          ADR 0012 records.
        type: boolean
        default: false

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lychee exclude flags
        id: excludes
        run: |
          flags=""
          while IFS= read -r p; do
            [ -n "$p" ] && flags="$flags --exclude-path $p"
          done <<< "${{ inputs.exclude-paths }}"
          while IFS= read -r u; do
            [ -n "$u" ] && flags="$flags --exclude $u"
          done <<< "${{ inputs.exclude-urls }}"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "lychee exclude flags: $flags"
      # A BUNDLE, NOT A REPLACEMENT. The runner's own CA file is copied first and the
      # supplements appended, so this can only ever ADD a missing link to a chain — pointing
      # SSL_CERT_FILE at the supplements alone would leave every other host in the corpus
      # unverifiable, which is the inverse of the intent.
      - name: Build CA bundle from chain supplements
        id: ca
        if: inputs.chain-supplements
        run: |
          shopt -s nullglob
          pems=(_meta/tls-chain/*.pem)
          if [ ${#pems[@]} -eq 0 ]; then
            echo "chain-supplements: true but _meta/tls-chain/ holds no .pem — nothing to add" >&2
            exit 1
          fi
          bundle="$RUNNER_TEMP/ca-bundle.pem"
          cat /etc/ssl/certs/ca-certificates.crt "${pems[@]}" > "$bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "appended to the runner CA bundle: ${pems[*]}"
      - name: External links
        uses: lycheeverse/lychee-action@v2
        env:
          SSL_CERT_FILE: ${{ steps.ca.outputs.bundle }}
        with:
          args: --no-progress --accept ${{ inputs.accept-codes }} --max-retries ${{ inputs.max-retries }} --retry-wait-time ${{ inputs.retry-wait-time }} ${{ steps.excludes.outputs.flags }} './**/*.md' 'llms.txt'
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./.toolkit
      # ALSO the corpus-level config checks — front door, issuing-body registry, extra
      # schemas. The flag skips the per-document schema pass, not the corpus's
      # configuration, so a corpus whose CI is trimmed to this workflow is still gated on
      # the facts every MCP response carries (corpus-toolkit#139).
      - name: Relationship graph and corpus configuration
        run: corpus-validate-frontmatter --config _meta/corpus.yml --check-relationships
