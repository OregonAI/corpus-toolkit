# Reusable workflow: frontmatter schema validation.
# Lives at .github/workflows/validate-frontmatter.yml in corpus-toolkit.
#
# Scoping is event-based so large corpora don't pay a full-corpus scan on
# every PR: pull_request/push validate only the changed files; schedule/
# workflow_dispatch run the full corpus. No caller-side bash needed.
name: validate-frontmatter
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: >-
          corpus-toolkit ref to install. LEAVE UNSET. The workflow then installs the very
          commit its own `uses:` resolved to (`github.job_workflow_sha`), so the workflow
          file and the code it runs cannot drift apart. It used to be required, and every
          corpus carried it as a second copy of the `uses:` tag — 154 of 616 PRs merged
          across the org in seven weeks existed to move those copies (ADR-0014). Set it
          only to run a DIFFERENT toolkit commit from the workflow file, which is a
          diagnostic, not a pin.
        type: string
        required: false
        default: ""
      jobs:
        description: worker processes for corpus-validate-frontmatter (empty = CLI auto-detects cpu_count)
        type: string
        default: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so --changed can compute the merge-base
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-toolkit
          ref: ${{ inputs.toolkit-ref || github.job_workflow_sha }}
          path: .toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./.toolkit
      - name: Validate frontmatter against schema
        run: |
          JOBS_ARG=""
          [ -n "${{ inputs.jobs }}" ] && JOBS_ARG="-j ${{ inputs.jobs }}"
          case "${{ github.event_name }}" in
            pull_request)
              git fetch --no-tags origin "${{ github.base_ref }}"
              corpus-validate-frontmatter --config _meta/corpus.yml \
                --changed "origin/${{ github.base_ref }}" $JOBS_ARG ;;
            push)
              corpus-validate-frontmatter --config _meta/corpus.yml \
                --changed "${{ github.event.before }}" $JOBS_ARG ;;
            *)  # schedule / workflow_dispatch — full corpus
              corpus-validate-frontmatter --config _meta/corpus.yml $JOBS_ARG ;;
          esac
