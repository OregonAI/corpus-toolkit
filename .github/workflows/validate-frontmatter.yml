# Reusable workflow: frontmatter schema validation.
# Lives at .github/workflows/validate-frontmatter.yml in corpus-toolkit.
name: validate-frontmatter
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: corpus-toolkit tag to use
        type: string
        default: v1.0.0

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./.toolkit
      - name: Validate frontmatter against schema
        run: corpus-validate-frontmatter --config _meta/corpus.yml --schema .toolkit/schemas/document.frontmatter.v1.schema.json
