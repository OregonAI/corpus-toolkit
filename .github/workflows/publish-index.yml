# Reusable workflow: publish this corpus's cross-corpus index to GitHub Pages.
#
# A sibling corpus resolving a citation like `OAR 166-300-0040` needs to know that document
# exists here and what it is called, and it cannot read _meta/graph.json to find out (that
# file is tens of MB). corpus-generate-index emits id -> [title, doc_type, path] without
# edges. The org landing page reads the same artifact to report live document counts.
#
# Publishes the INDEX ONLY, deliberately — no landing page. Publishing the index is the
# platform contract every corpus owes its siblings; a human-facing site is each corpus's
# own choice, built by its own src/build_site.py (see executive-regulatory-frameworks).
# A corpus using this workflow serves /corpus-index.json with no / , which is exactly what
# the org page expects: it renders counts and a repo link, and only adds an "Explore the
# corpus" link when the site root actually answers.
#
# Do NOT call this from a corpus that already deploys Pages itself — two workflows
# deploying to one Pages site will fight over the `pages` concurrency group.
#
# THE CALLER MUST GRANT PERMISSIONS. The `permissions:` block on the job below cannot
# obtain anything the caller does not already have — a reusable workflow can only REDUCE
# the caller's permissions, never escalate. With this org's read-only default token, a
# caller that omits them fails with `startup_failure` and NO job, so there is no log to
# read. Your caller needs:
#
#   permissions:
#     contents: read
#     pages: write
#     id-token: write
#
# Pages must also be enabled on the calling repo with the workflow builder:
#   gh api -X PUT repos/<org>/<repo>/pages -f build_type=workflow
# GitHub auto-enables the legacy Jekyll builder, which fights an Actions deploy.
#
# Built at deploy time and never committed: a committed index is a generated file that can
# silently fall behind its own corpus, and that failure shows up in someone ELSE's
# repository.
name: publish-index
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: >-
          corpus-toolkit tag to install. Set this explicitly to the same tag you pin in
          `uses:` — they are separate knobs and drift silently otherwise, because `uses:`
          selects the WORKFLOW FILE while this selects the CODE it runs.
        type: string
        required: true
      config:
        description: path to the corpus config
        type: string
        default: _meta/corpus.yml

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-toolkit
          ref: ${{ inputs.toolkit-ref }}
          path: .toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./.toolkit
      - name: Generate the index
        run: |
          mkdir -p site
          corpus-generate-index --config "${{ inputs.config }}" --output site/corpus-index.json
          # llms.txt is the agent-facing entry point; ship it alongside when the corpus has one.
          [ -f llms.txt ] && cp llms.txt site/ || true
          # Pages runs Jekyll over the artifact otherwise, which drops files beginning with _.
          touch site/.nojekyll
          ls -la site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
