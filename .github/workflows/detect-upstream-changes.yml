# Reusable workflow: scheduled upstream change detection.
# Re-fetches manifest sources, diffs hashes (documents) or schemas (APIs), seeds any source
# that has no baseline yet, and writes the ROLLING drift report — DRIFT.md, rendered from
# drift-state.json — plus STATUS.md. Files no issues (ADR 0015). Everything the run wrote
# lands in one PR on a stable branch that merges itself when the corpus's checks are green.
#
# WHY A REPORT AND NOT TICKETS. Until v1.34.0 this filed one issue per changed source (cap
# 25), one per whole-group change and one per persistent access failure. Measured
# 2026-09-02: 90 of the org's 172 open issues were those, none read. The claims are the same
# and now live in DRIFT.md, in the corpus, where somebody about to re-ingest will look.
#
# THE PR NEEDS A BOT TOKEN. See the `secrets:` block: the built-in token can push the branch
# but cannot open the PR in this org, and a PR it opened would run no CI. Callers pass
# `secrets: inherit`; the token is one org secret, DRIFT_BOT_TOKEN.
#
# WHY THE PR MERGES ITSELF. Since 2026-09-03 every public corpus protects `main` with
# required status checks and no required reviews (ADR-0014), so `gh pr merge --auto` lands
# the state the moment the checks pass. The v1.32.0 obligation — "merge the chore PR at
# least as often as the schedule runs or the streaks reset" — is gone. Where auto-merge is
# unavailable (a private repo on this plan) the request is declined and the PR waits.
name: detect-upstream-changes
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: >-
          corpus-toolkit ref to install. LEAVE UNSET. The workflow then installs the very
          commit its own `uses:` resolved to (`github.job_workflow_sha`), so the workflow
          file and the code it runs cannot drift apart. It used to be required, and every
          corpus carried it as a second copy of the `uses:` tag — 154 of 616 PRs merged
          across the org in seven weeks existed to move those copies (ADR-0014). Set it
          only to run a DIFFERENT toolkit commit from the workflow file, which is a
          diagnostic, not a pin.
        type: string
        required: false
        default: ""
      groups:
        description: >-
          Newline-separated source groups to check this run (each becomes a `--group`).
          Empty = every group. This is how a corpus runs different groups on different
          cadences — executive-regulatory-frameworks checks thirteen monthly groups on the
          5th and everything quarterly — without a bespoke job of its own: state for the
          groups NOT in scope is held, not cleared (ADR 0013's rule, now shared by
          drift-state.json).
        type: string
        default: ""
    secrets:
      DRIFT_BOT_TOKEN:
        description: >-
          A token that may open pull requests and whose PRs run CI. Pass `secrets: inherit`
          from the caller and define it as an ORG secret once. TWO facts make this
          necessary, both measured on the first v1.34.0 runs (2026-09-03): with the built-in
          GITHUB_TOKEN `gh pr create` fails with "GitHub Actions is not permitted to create
          or approve pull requests", and even where that org setting is on, a PR the
          built-in token creates triggers NO workflow runs, so required checks never report
          and auto-merge never fires — the state sits on a branch forever. That is also why
          no `chore/status-md` PR ever existed after v1.30.0. Absent this secret the run
          pushes the branch and FAILS at the PR step, naming this paragraph.
        required: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The report arrives as a PR, so the job needs to be able to open one. `issues:
      # write` is deliberately GONE: this workflow files nothing (ADR 0015).
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The bot token when there is one, so the branch push and the PR are the bot's
          # and CI runs on the PR. Falls back to GITHUB_TOKEN, which can push but not open.
          token: ${{ secrets.DRIFT_BOT_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-toolkit
          ref: ${{ inputs.toolkit-ref || github.job_workflow_sha }}
          path: .toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y poppler-utils
      - run: pip install ./.toolkit
      # RED MEANS THE RUN COULD NOT DO ITS JOB, never that upstream changed: systemic fetch
      # failure (>20%), nothing in scope, a refused manifest rewrite, or a watched source
      # that arrived and still could not be compared (`RunVerdict` in changes.py, mirrored
      # in DRIFT.md's "Last run"). Do not paper over it with `continue-on-error`.
      - name: Detect drift, seed what has no baseline, write DRIFT.md
        id: detect
        env:
          GROUPS: ${{ inputs.groups }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r g; do
            g="${g//[[:space:]]/}"
            [ -n "$g" ] && args+=(--group "$g")
          done <<< "$GROUPS"
          corpus-detect-changes --config _meta/corpus.yml "${args[@]}"
      # `if: always()` so STATUS.md still regenerates on a red drift step. The freshness
      # report is independent of whether the drift run could compare anything.
      - name: Regenerate STATUS.md
        if: always()
        run: corpus-generate-status --config _meta/corpus.yml --output STATUS.md
      # EVERYTHING THE RUN WROTE, IN ONE PR, ON A STABLE BRANCH. `git add -u` picks up the
      # manifest files seeding edited; the explicit adds cover the artifacts that may not be
      # tracked yet in a corpus that has never run this revision. A run that changed
      # nothing opens nothing. The branch is force-pushed: both the state and the report
      # are regenerated whole, so an older copy has no information in it.
      #
      # THE STATE MUST LAND OR THE ROLLING VIEW DOES NOT ROLL. drift-state.json and
      # access-failures.json feed the NEXT run; a run whose PR never merges starts from
      # whatever `main` last had. That is what `gh pr merge --auto` is for.
      #
      # A PR THAT COULD NOT BE OPENED IS A RED STEP, not a warning. The first version warned
      # and exited 0; four corpora then ran green on 2026-09-03 with their entire first drift
      # state stranded on a branch nobody knew about — "could not check" wearing the shape of
      # "done", one layer up from the fetch loop this file exists to keep honest.
      - name: Open (or update) the drift PR and ask it to merge itself
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.DRIFT_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          HAVE_BOT_TOKEN: ${{ secrets.DRIFT_BOT_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name "corpus-bot"
          git config user.email "actions@github.com"
          git add -u
          for f in DRIFT.md drift-state.json source-outcomes.json access-failures.json STATUS.md; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Nothing the run wrote differs from main."
            exit 0
          fi
          BRANCH="chore/drift"
          git commit -m "chore: drift run — DRIFT.md, state, seeded baselines, STATUS.md"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Updated the open drift PR."
          else
            if ! gh pr create --head "$BRANCH" \
              --title "chore: drift run — DRIFT.md, state, seeded baselines" \
              --body "Generated by the scheduled drift run (ADR 0015). DRIFT.md is the rolling report: every source whose upstream differs from the baseline this corpus mirrors, since when, plus access-failure streaks. Baselines seeded this run are manifest edits in this PR. Merging is what lets the next run start from this state; the PR asks to merge itself once the checks pass."; then
              echo "::error::The drift state is pushed to ${BRANCH} but no PR could be opened, so it will never reach main on its own."
              if [ "$HAVE_BOT_TOKEN" != "true" ]; then
                echo "::error::No DRIFT_BOT_TOKEN reached this workflow. Define it as an ORG secret (a token with contents + pull-requests write on the corpora) and pass \`secrets: inherit\` from the calling job. The built-in GITHUB_TOKEN cannot open a PR in this org, and a PR it opened would run no CI, so it could never merge itself."
              fi
              exit 1
            fi
          fi
          if [ "$HAVE_BOT_TOKEN" != "true" ]; then
            echo "::warning::PR opened with the built-in token: it will run no CI and cannot merge itself. Pass a DRIFT_BOT_TOKEN (see the workflow's secrets block)."
          fi
          gh pr merge --auto --squash "$BRANCH" \
            || echo "::notice::auto-merge unavailable here (private repo, or main not protected with required checks) — merge chore/drift by hand"
