# Reusable workflow: scheduled upstream change detection.
# Re-fetches manifest sources, diffs hashes (documents) or schemas (APIs),
# opens an issue per drifted source. Also regenerates STATUS.md.
name: detect-upstream-changes
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: >-
          corpus-toolkit ref to install. LEAVE UNSET. The workflow then installs the very
          commit its own `uses:` resolved to (`github.job_workflow_sha`), so the workflow
          file and the code it runs cannot drift apart. It used to be required, and every
          corpus carried it as a second copy of the `uses:` tag — 154 of 616 PRs merged
          across the org in seven weeks existed to move those copies (ADR-0014). Set it
          only to run a DIFFERENT toolkit commit from the workflow file, which is a
          diagnostic, not a pin.
        type: string
        required: false
        default: ""

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      # STATUS.md now arrives as a PR rather than a push to a protected default branch,
      # so the job needs to be able to open one.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OregonAI/corpus-toolkit
          ref: ${{ inputs.toolkit-ref || github.job_workflow_sha }}
          path: .toolkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y poppler-utils
      - run: pip install ./.toolkit
      # This step now FAILS the job when the run could not do its job: the issue cap
      # truncated the report, or no in-scope source has a recorded baseline
      # (corpus-toolkit#67, #68). Both used to conclude `success` with the explanation on
      # stderr near the end of a multi-thousand-line log, where it went unread through two
      # occurrences. Do not paper over it with `continue-on-error` — a green check is
      # exactly the wrong answer. Seed the manifest (`--record-baseline`) or fix the group
      # the breakdown names.
      - name: Detect drift and open issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corpus-detect-changes --config _meta/corpus.yml --open-issues
      # `if: always()` so STATUS.md still regenerates on a red drift step. The freshness
      # report is independent of whether drift reporting was truncated, and losing it is
      # not a useful consequence of a capped run.
      - name: Regenerate STATUS.md
        if: always()
        run: corpus-generate-status --config _meta/corpus.yml --output STATUS.md
      # STATUS.md GOES THROUGH REVIEW LIKE ANYTHING ELSE (corpus-toolkit#: protected main).
      # This used to `git push` straight to the default branch. Where that branch is
      # protected -- which is every corpus that requires a PR review -- the push is declined
      # (`GH006: protected branch hook declined`) and the whole scheduled run goes red, so
      # the drift report it exists to deliver is buried under a failure about a generated
      # file. oregon-budget and oregon-legislature had been red every week since 2026-08-10
      # for exactly this, federal-reference and corpus-template since 2026-08-03.
      #
      # The fix is not to ignore the rejection: STATUS.md would then silently stop updating
      # and nothing would say so. It opens a PR instead, on a STABLE branch, so a run that
      # finds nothing new updates the existing PR rather than filing another.
      #
      # access-failures.json RIDES ALONG (corpus-toolkit#166). Without this it is written
      # into the runner's own working tree and destroyed with it -- every run then reloads
      # empty state, `consecutive_failures` can never exceed 1, and `first_failed_at` resets
      # to today every time, so NEITHER escalation arm can ever fire; access-failure.json's
      # entire reason to exist is surviving to the next run. `git add` guards a missing file
      # rather than failing the step -- the detect step above can die before reaching the
      # fetch loop that writes it, and `if: always()` means this step still runs then.
      #
      # THE CAVEAT THE ADR NAMES STILL APPLIES AND THIS STEP DOES NOT REMOVE IT: a streak
      # this run wrote only feeds the NEXT run's escalation decision once this PR is
      # MERGED. An unmerged PR means the next run's checkout still sees whatever state the
      # default branch last had (often none), so a corpus whose weekly chore PR is not
      # reviewed weekly will see both arms undercount for as long as it sits open -- the
      # same latency STATUS.md already accepts, now shared by a file whose whole job is
      # counting across runs. Merging it is this corpus's own responsibility, same as
      # STATUS.md and a `--record-baseline` manifest diff already are.
      - name: Open a PR for generated state (STATUS.md, access-failures.json) if changed
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "corpus-bot"
          git config user.email "actions@github.com"
          git add STATUS.md
          git add access-failures.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "STATUS.md and access-failures.json are unchanged."
            exit 0
          fi
          BRANCH="chore/status-md"
          git commit -m "chore: regenerate STATUS.md, update access-failure streaks"
          # Force-with-lease is wrong here: the branch is this job's alone and its previous
          # head is deliberately discarded, because both files are regenerated whole and an
          # older copy has no information in it.
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Updated the open STATUS.md/access-failures.json PR."
          else
            gh pr create --head "$BRANCH" \
              --title "chore: regenerate STATUS.md, update access-failure streaks" \
              --body "Generated by the scheduled drift run. Both files are derived, so this PR is the review step for files no human writes. Merge promptly: access-failures.json's fetch-failure streaks only carry over to the next scheduled run once this is merged (corpus-toolkit#166)." \
              || echo "::warning::could not open the STATUS.md/access-failures.json PR; the branch ${BRANCH} carries the change"
          fi
